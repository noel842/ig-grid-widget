<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IG Grid Preview</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fafafa;color:#0a0a0a}

/* ── Setup ── */
#setup{max-width:420px;margin:0 auto;padding:28px 20px}
#setup h1{font-size:15px;font-weight:700;margin-bottom:3px}
#setup p{font-size:12px;color:#737373;margin-bottom:22px;line-height:1.55}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;font-weight:600;color:#404040;margin-bottom:4px;letter-spacing:.02em}
.field input{width:100%;padding:9px 11px;border:1.5px solid #e5e5e5;border-radius:10px;font-size:13px;color:#0a0a0a;background:#fff;outline:none;transition:border-color .15s}
.field input:focus{border-color:#833AB4}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.go-btn{width:100%;padding:11px;border:none;border-radius:10px;background:linear-gradient(135deg,#833AB4,#C13584,#E1306C);color:#fff;font-size:13px;font-weight:700;cursor:pointer;margin-top:4px;transition:opacity .15s}
.go-btn:hover{opacity:.88}
.go-btn:disabled{opacity:.45;cursor:not-allowed}
.err{margin-top:10px;padding:9px 12px;background:#fff0f0;border:1px solid #fca5a5;border-radius:8px;font-size:12px;color:#b91c1c;line-height:1.5;display:none}
.hint{margin-top:14px;padding:10px 12px;background:#f5f5f5;border-radius:8px;font-size:11px;color:#737373;line-height:1.65}
.hint b{color:#404040}

/* ── Feed ── */
#feed{display:none;max-width:480px;margin:0 auto;background:#fff;border:1px solid #dbdbdb}

/* profile header */
.prof-bar{padding:14px 14px 0}
.prof-top{display:flex;align-items:center;gap:18px;margin-bottom:12px}
.av-ring{width:68px;height:68px;flex-shrink:0;border-radius:50%;padding:2.5px;background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888)}
.av-inner{width:100%;height:100%;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:700;color:#833AB4;border:2px solid #fff}
.prof-right{flex:1;min-width:0}
.prof-handle{font-size:14px;font-weight:600;margin-bottom:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prof-counts{display:flex;gap:18px}
.cnt{text-align:center}
.cnt-n{display:block;font-size:14px;font-weight:600}
.cnt-l{font-size:11px;color:#737373}

/* profile switcher */
.prof-switcher{display:flex;gap:6px;padding:10px 14px 0;flex-wrap:wrap}
.prof-chip{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid #dbdbdb;background:#fff;color:#737373;transition:all .12s;white-space:nowrap}
.prof-chip.on{background:linear-gradient(135deg,#833AB4,#C13584,#E1306C);color:#fff;border-color:transparent}

/* status tabs */
.tabs{display:flex;border-top:1px solid #dbdbdb;margin-top:12px}
.tab{flex:1;padding:10px 0;text-align:center;font-size:11px;font-weight:700;color:#8e8e8e;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;border-top:2px solid transparent;margin-top:-1px;transition:all .12s}
.tab.on{color:#0a0a0a;border-top-color:#0a0a0a}

/* grid — 4:5 portrait */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:#dbdbdb}
.cell{aspect-ratio:4/5;position:relative;overflow:hidden;cursor:pointer;background:#efefef}
.cell img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .22s}
.cell:hover img{transform:scale(1.05)}
.no-img{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#c7c7c7;font-size:26px}
.cell-ov{position:absolute;inset:0;background:rgba(0,0,0,.38);opacity:0;transition:opacity .16s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px}
.cell:hover .cell-ov{opacity:1}
.ov-date{font-size:10px;font-weight:700;color:#fff;background:rgba(131,58,180,.85);border-radius:20px;padding:3px 10px;white-space:nowrap}
.ov-title{font-size:10px;color:rgba(255,255,255,.9);text-align:center;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:90%}
.dot{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;border:1.5px solid rgba(255,255,255,.85)}
.d-up{background:#facc15}
.d-td{background:#f97316}
.d-pb{background:#4ade80}
.dimmed::after{content:'';position:absolute;inset:0;background:rgba(255,255,255,.25);pointer-events:none}
.empty-cell{aspect-ratio:4/5;background:#fafafa;display:flex;align-items:center;justify-content:center;color:#e5e5e5;font-size:22px}

/* state */
.state{padding:44px 20px;text-align:center;color:#a3a3a3;font-size:13px;background:#fafafa}

/* bottom bar */
.bar{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-top:1px solid #efefef}
.bar-btn{font-size:12px;color:#833AB4;background:none;border:none;cursor:pointer;font-weight:600;padding:0}
.bar-btn:hover{text-decoration:underline}
.bar-count{font-size:11px;color:#a3a3a3}

/* modal */
.mbk{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:999;align-items:center;justify-content:center;padding:16px}
.mbk.on{display:flex}
.mbox{background:#fff;border-radius:4px;overflow:hidden;width:100%;max-width:320px}
.mbox img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:#efefef}
.mno-img{width:100%;aspect-ratio:4/5;background:#efefef;display:flex;align-items:center;justify-content:center;color:#c7c7c7;font-size:36px}
.mbody{padding:13px 15px}
.mtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.mpill{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:700}
.mp-up{background:#fef9c3;color:#854d0e}
.mp-td{background:#ffedd5;color:#9a3412}
.mp-pb{background:#dcfce7;color:#166534}
.mclose{background:none;border:none;cursor:pointer;font-size:22px;color:#737373;line-height:1}
.mclose:hover{color:#0a0a0a}
.mprofile{font-size:11px;color:#833AB4;font-weight:600;margin-bottom:5px}
.mtitle{font-size:13px;font-weight:700;margin-bottom:5px}
.mcap{font-size:12px;color:#525252;line-height:1.6}
.mlink{display:inline-block;margin-top:9px;font-size:11px;color:#833AB4;text-decoration:none;font-weight:600}
.mlink:hover{text-decoration:underline}
</style>
</head>
<body>

<!-- Setup -->
<div id="setup">
  <h1>Instagram grid preview</h1>
  <p>Connect your Notion content calendar to preview your feed by profile.</p>
  <div class="field">
    <label>Notion integration token</label>
    <input type="password" id="tok" placeholder="secret_xxxxxxxxxxxx" autocomplete="off">
  </div>
  <div class="field">
    <label>Database ID</label>
    <input type="text" id="dbid" placeholder="32-character ID from your Notion URL">
  </div>
  <div class="frow">
    <div class="field">
      <label>Image URL property</label>
      <input type="text" id="img-prop" value="Drive Link">
    </div>
    <div class="field">
      <label>Publish date property</label>
      <input type="text" id="date-prop" value="Post Date">
    </div>
  </div>
  <div class="frow">
    <div class="field">
      <label>Caption property</label>
      <input type="text" id="cap-prop" value="Caption">
    </div>
    <div class="field">
      <label>Profile property</label>
      <input type="text" id="prof-prop" value="Account">
    </div>
  </div>
  <button class="go-btn" id="go-btn" onclick="connect()">Connect &amp; preview</button>
  <div class="err" id="err"></div>
  <div class="hint">
    <b>Case-sensitive:</b> property names must match Notion exactly.<br>
    Drive images need <b>Anyone with the link → Viewer</b> sharing enabled.
  </div>
</div>

<!-- Feed -->
<div id="feed">
  <div class="prof-bar">
    <div class="prof-top">
      <div class="av-ring"><div class="av-inner" id="av">IG</div></div>
      <div class="prof-right">
        <div class="prof-handle" id="ph">@profile</div>
        <div class="prof-counts">
          <div class="cnt"><span class="cnt-n" id="ct">0</span><span class="cnt-l">posts</span></div>
          <div class="cnt"><span class="cnt-n" id="cu">0</span><span class="cnt-l">upcoming</span></div>
          <div class="cnt"><span class="cnt-n" id="cp">0</span><span class="cnt-l">published</span></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Profile chips -->
  <div class="prof-switcher" id="prof-switcher"></div>

  <!-- Status tabs -->
  <div class="tabs">
    <div class="tab on" id="tab-all"  onclick="setTab('all',this)">Grid</div>
    <div class="tab" id="tab-up"      onclick="setTab('upcoming',this)">Upcoming</div>
    <div class="tab" id="tab-pub"     onclick="setTab('published',this)">Published</div>
  </div>

  <div id="grid-wrap"></div>

  <div class="bar">
    <button class="bar-btn" onclick="back()">&#8592; Settings</button>
    <span class="bar-count" id="bar-count"></span>
    <button class="bar-btn" onclick="refresh()">&#8635; Refresh</button>
  </div>
</div>

<!-- Modal -->
<div class="mbk" id="mbk" onclick="closeMif(event)">
  <div class="mbox">
    <img id="mi" src="" alt="" style="display:none">
    <div class="mno-img" id="mni" style="display:none">&#128247;</div>
    <div class="mbody">
      <div class="mtop">
        <span class="mpill" id="mpill"></span>
        <button class="mclose" onclick="closeM()" aria-label="Close">&#215;</button>
      </div>
      <div class="mprofile" id="mprof"></div>
      <div class="mtitle" id="mt"></div>
      <div class="mcap" id="mc"></div>
      <a class="mlink" id="ml" href="#" target="_blank" rel="noopener" style="display:none">Open in Drive &#8599;</a>
    </div>
  </div>
</div>

<script>
const STORE_KEY = 'ig-widget-config';
let allPosts = [], curProfile = 'all', curTab = 'all';
const now = new Date();

/* ── helpers ── */
function thumb(url) {
  if (!url) return null;
  const m = url.match(/\/d\/([\w-]+)/);
  if (m) return 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w600';
  if (/^https?:\/\//.test(url)) return url;
  return null;
}
function fmt(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}
function status(iso) {
  if (!iso) return 'up';
  const d = new Date(iso);
  if (d < now) return 'pb';
  const t = new Date(); t.setHours(0,0,0,0);
  if (d.toDateString() === t.toDateString()) return 'td';
  return 'up';
}
function statusLabel(s, iso) {
  if (s === 'pb') return 'Published ' + fmt(iso);
  if (s === 'td') return 'Posting today';
  return 'Scheduled ' + fmt(iso);
}
function fmtId(raw) {
  const c = raw.replace(/-/g,'').replace(/\?.*/,'');
  return c.replace(/(.{8})(.{4})(.{4})(.{4})(.{12})/, '$1-$2-$3-$4-$5');
}
function showErr(msg) {
  const e = document.getElementById('err');
  e.textContent = msg; e.style.display = 'block';
}

/* ── persistence ── */
function saveConfig() {
  const cfg = {
    tok:      document.getElementById('tok').value.trim(),
    dbid:     document.getElementById('dbid').value.trim(),
    imgProp:  document.getElementById('img-prop').value.trim(),
    dateProp: document.getElementById('date-prop').value.trim(),
    capProp:  document.getElementById('cap-prop').value.trim(),
    profProp: document.getElementById('prof-prop').value.trim(),
  };
  try { localStorage.setItem(STORE_KEY, JSON.stringify(cfg)); } catch(e) {}
}
function loadConfig() {
  try {
    const cfg = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if (!cfg) return false;
    document.getElementById('tok').value      = cfg.tok      || '';
    document.getElementById('dbid').value     = cfg.dbid     || '';
    document.getElementById('img-prop').value  = cfg.imgProp  || 'Drive Link';
    document.getElementById('date-prop').value = cfg.dateProp || 'Post Date';
    document.getElementById('cap-prop').value  = cfg.capProp  || 'Caption';
    document.getElementById('prof-prop').value = cfg.profProp || 'Account';
    return !!(cfg.tok && cfg.dbid);
  } catch(e) { return false; }
}

/* ── fetch ── */
async function fetchPosts() {
  const tok      = document.getElementById('tok').value.trim();
  const dbid     = document.getElementById('dbid').value.trim();
  const imgProp  = document.getElementById('img-prop').value.trim()  || 'Drive Link';
  const dateProp = document.getElementById('date-prop').value.trim() || 'Post Date';
  const capProp  = document.getElementById('cap-prop').value.trim()  || 'Caption';
  const profProp = document.getElementById('prof-prop').value.trim() || 'Account';

  const res = await fetch('/api/notion', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-notion-token': tok,
      'x-database-id': fmtId(dbid),
    },
    body: JSON.stringify({}),
  });

  const data = await res.json();
  if (!res.ok) {
    const c = data.code || '';
    if (res.status === 401 || c === 'unauthorized')
      throw new Error('Invalid token. Check your integration secret at notion.so/my-integrations.');
    if (res.status === 403 || c === 'restricted_resource')
      throw new Error('Access denied. Open your Notion database → ··· → Connections → connect your integration.');
    if (res.status === 404)
      throw new Error('Database not found. Double-check the ID from your Notion URL.');
    throw new Error(data.error || 'Error ' + res.status);
  }

  return (data.results || []).map(pg => {
    const p = pg.properties || {};
    const tv = p[imgProp], dv = p[dateProp], cv = p[capProp], pv = p[profProp];
    const titv = p['Name'] || p['Title'] || Object.values(p).find(x => x.type === 'title');
    return {
      title:   titv?.title?.map(t => t.plain_text).join('') || '',
      url:     tv?.url || tv?.rich_text?.[0]?.plain_text || null,
      date:    dv?.date?.start || null,
      caption: cv?.rich_text?.map(t => t.plain_text).join('') || '',
      profile: pv?.select?.name || pv?.rich_text?.[0]?.plain_text || '',
    };
  });
}

/* ── connect ── */
async function connect() {
  document.getElementById('err').style.display = 'none';
  const tok  = document.getElementById('tok').value.trim();
  const dbid = document.getElementById('dbid').value.trim();
  if (!tok)  { showErr('Enter your Notion integration token.'); return; }
  if (!dbid) { showErr('Enter your database ID.'); return; }

  const btn = document.getElementById('go-btn');
  btn.disabled = true; btn.textContent = 'Connecting…';

  try {
    const posts = await fetchPosts();
    saveConfig();
    allPosts = posts;
    showFeed();
  } catch(ex) {
    showErr(ex.message);
  } finally {
    btn.disabled = false; btn.textContent = 'Connect & preview';
  }
}

async function refresh() {
  const btn = document.querySelector('.bar-btn:last-child');
  btn.textContent = 'Loading…';
  try {
    allPosts = await fetchPosts();
    renderProfiles();
    renderGrid();
  } catch(ex) {
    alert(ex.message);
  } finally {
    btn.textContent = '⟳ Refresh';
  }
}

/* ── render ── */
function showFeed() {
  document.getElementById('setup').style.display = 'none';
  document.getElementById('feed').style.display = 'block';
  curProfile = 'all'; curTab = 'all';
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
  document.getElementById('tab-all').classList.add('on');
  renderProfiles();
  renderGrid();
}

function renderProfiles() {
  // collect unique profiles
  const profiles = [...new Set(allPosts.map(p => p.profile).filter(Boolean))].sort();
  const switcher = document.getElementById('prof-switcher');

  if (profiles.length <= 1) {
    switcher.style.display = 'none';
    updateHeader(curProfile === 'all' ? (profiles[0] || '') : curProfile);
    return;
  }

  switcher.style.display = 'flex';
  let html = `<div class="prof-chip ${curProfile==='all'?'on':''}" onclick="switchProfile('all',this)">All profiles</div>`;
  profiles.forEach(pr => {
    const on = curProfile === pr ? ' on' : '';
    html += `<div class="prof-chip${on}" onclick="switchProfile('${pr.replace(/'/g,"\\'")}',this)">${pr}</div>`;
  });
  switcher.innerHTML = html;
  updateHeader(curProfile === 'all' ? 'All profiles' : curProfile);
}

function updateHeader(profileName) {
  const handle = profileName.startsWith('@') ? profileName : (profileName ? '@' + profileName : '@profile');
  document.getElementById('av').textContent = profileName.replace('@','').slice(0,2).toUpperCase() || 'IG';
  document.getElementById('ph').textContent = handle;

  const fp = filteredByProfile();
  document.getElementById('ct').textContent = fp.length;
  document.getElementById('cu').textContent = fp.filter(p => status(p.date) !== 'pb').length;
  document.getElementById('cp').textContent = fp.filter(p => status(p.date) === 'pb').length;
}

function switchProfile(name, el) {
  curProfile = name;
  document.querySelectorAll('.prof-chip').forEach(c => c.classList.remove('on'));
  el.classList.add('on');
  updateHeader(name === 'all' ? 'All profiles' : name);
  renderGrid();
}

function setTab(name, el) {
  curTab = name;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
  el.classList.add('on');
  renderGrid();
}

function filteredByProfile() {
  if (curProfile === 'all') return allPosts;
  return allPosts.filter(p => p.profile === curProfile);
}

function filteredView() {
  const fp = filteredByProfile();
  if (curTab === 'upcoming')  return fp.filter(p => status(p.date) !== 'pb');
  if (curTab === 'published') return fp.filter(p => status(p.date) === 'pb');
  return fp;
}

function renderGrid() {
  const posts = filteredView();
  posts.sort((a,b) => {
    if (!a.date) return 1; if (!b.date) return -1;
    return new Date(a.date) - new Date(b.date);
  });

  const wrap = document.getElementById('grid-wrap');
  document.getElementById('bar-count').textContent = posts.length + ' posts';

  if (!posts.length) {
    wrap.innerHTML = '<div class="state">No posts in this view.</div>';
    return;
  }

  const total = Math.ceil(Math.max(posts.length, 9) / 3) * 3;
  let h = '<div class="grid">';
  for (let i = 0; i < total; i++) {
    const p = posts[i];
    if (!p) { h += '<div class="empty-cell">+</div>'; continue; }
    const t = thumb(p.url);
    const s = status(p.date);
    h += `<div class="cell${s==='pb'?' dimmed':''}" onclick="openM(${i})">
      ${t
        ? `<img src="${t}" alt="" loading="lazy" onerror="this.style.display='none';this.nextSibling.style.display='flex'"><div class="no-img" style="display:none;position:absolute;inset:0">&#128247;</div>`
        : `<div class="no-img">&#128247;</div>`}
      <div class="dot d-${s}"></div>
      <div class="cell-ov">
        ${p.date   ? `<div class="ov-date">${s==='pb'?'&#10003; ':''}${fmt(p.date)}</div>` : ''}
        ${p.title  ? `<div class="ov-title">${p.title}</div>` : ''}
      </div>
    </div>`;
  }
  h += '</div>';
  wrap.innerHTML = h;
}

function openM(i) {
  const posts = filteredView();
  posts.sort((a,b) => {
    if (!a.date) return 1; if (!b.date) return -1;
    return new Date(a.date) - new Date(b.date);
  });
  const p = posts[i]; if (!p) return;
  const t = thumb(p.url);
  const mi = document.getElementById('mi'), mni = document.getElementById('mni');
  if (t) { mi.src = t; mi.style.display = 'block'; mni.style.display = 'none'; }
  else   { mi.style.display = 'none'; mni.style.display = 'flex'; }
  const s = status(p.date);
  const pill = document.getElementById('mpill');
  pill.textContent = statusLabel(s, p.date);
  pill.className = 'mpill mp-' + s;
  document.getElementById('mprof').textContent = p.profile ? p.profile : '';
  document.getElementById('mt').textContent = p.title || '';
  document.getElementById('mc').textContent = p.caption || '';
  const ml = document.getElementById('ml');
  if (p.url) { ml.href = p.url; ml.style.display = 'inline-block'; } else { ml.style.display = 'none'; }
  document.getElementById('mbk').classList.add('on');
}

function closeMif(e) { if (e.target === document.getElementById('mbk')) closeM(); }
function closeM() { document.getElementById('mbk').classList.remove('on'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeM(); });

function back() {
  document.getElementById('feed').style.display = 'none';
  document.getElementById('setup').style.display = 'block';
}

/* ── auto-connect on load if saved config exists ── */
window.addEventListener('DOMContentLoaded', async () => {
  const hasSaved = loadConfig();
  if (hasSaved) {
    const btn = document.getElementById('go-btn');
    btn.disabled = true; btn.textContent = 'Reconnecting…';
    try {
      allPosts = await fetchPosts();
      showFeed();
    } catch(ex) {
      btn.disabled = false; btn.textContent = 'Connect & preview';
    }
  }
});
</script>
</body>
</html>
